[package]
name = "voxl-android-decode"
version = "0.1.0"
edition = "2024"
publish = false

# cdylib: the NativeActivity APK loads it; rlib: the shell executable links it.
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
android_logger = "0.15.1"
log = "0.4.35"
ndk = { version = "0.9.0", features = ["media", "api-level-28"] }

# Not part of the server's build.
[workspace]
